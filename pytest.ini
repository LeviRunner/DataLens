; pytest.ini — Onde o pytest procura testes.
;
; `testpaths` restringe a coleta a tests/. Sem isso, o pytest varreria o repo inteiro e
; tentaria coletar os rascunhos `src/datalens/conectores/test_*.py` — que sao copias do
; modulo para estudo, nao testes. Um rascunho pela metade viraria erro de coleta e
; deixaria a suite inteira vermelha sem nenhum teste de verdade ter falhado.
[pytest]
testpaths = tests
